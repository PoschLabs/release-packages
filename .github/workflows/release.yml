name: Release packages

on:
  workflow_call:
    inputs:
      package-server-url:
        description: URL of the package server (e.g. vars.PACKAGE_SERVER_URL)
        type: string
        required: true
      artifact-name:
        description: Name of the artifact containing the unsigned packages
        type: string
        default: unsigned-linux-packages
      rpm-repository:
        type: string
        default: yum
      deb-repository:
        type: string
        default: apt
      publish-rpm:
        type: boolean
        default: true
      publish-deb:
        type: boolean
        default: true
    secrets:
      package-server-username:
        description: Username for the package server
        required: true
      package-server-password:
        description: Password for the package server
        required: true
      sign-infisical-url:
        description: Address of the Infisical instance
        required: true
      sign-infisical-identity-id:
        description: ID of the repository's Infisical machine identity
        required: true
      sign-infisical-project-id:
        description: Infisical project that holds the signing key
        required: true
      sign-infisical-secret-path:
        description: Folder in the Infisical project with the signing secrets
        required: true

jobs:
  sign:
    name: Sign RPM packages
    permissions:
      id-token: write
    uses: PoschLabs/sign-rpms/.github/workflows/sign.yml@v1
    with:
      artifact-name: ${{ inputs.artifact-name }}
      signed-artifact-name: signed-rpm-packages
    secrets:
      SIGN_INFISICAL_URL: ${{ secrets.sign-infisical-url }}
      SIGN_INFISICAL_IDENTITY_ID: ${{ secrets.sign-infisical-identity-id }}
      SIGN_INFISICAL_PROJECT_ID: ${{ secrets.sign-infisical-project-id }}
      SIGN_INFISICAL_SECRET_PATH: ${{ secrets.sign-infisical-secret-path }}

  publish-rpm:
    name: Publish RPM packages
    if: ${{ inputs.publish-rpm }}
    needs: sign
    uses: PoschLabs/publish-packages/.github/workflows/publish-rpm.yml@v1
    with:
      server-url: ${{ inputs.package-server-url }}
      artifact-name: signed-rpm-packages
      repository: ${{ inputs.rpm-repository }}
    secrets:
      server-username: ${{ secrets.package-server-username }}
      server-password: ${{ secrets.package-server-password }}

  publish-deb:
    name: Publish DEB packages
    if: ${{ inputs.publish-deb }}
    needs: sign
    uses: PoschLabs/publish-packages/.github/workflows/publish-deb.yml@v1
    with:
      server-url: ${{ inputs.package-server-url }}
      artifact-name: ${{ inputs.artifact-name }}
      repository: ${{ inputs.deb-repository }}
    secrets:
      server-username: ${{ secrets.package-server-username }}
      server-password: ${{ secrets.package-server-password }}
